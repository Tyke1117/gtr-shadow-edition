<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer metallic border -->
  <rect x="5" y="5" width="110" height="110" rx="8" fill="rgba(0,0,0,0.8)" stroke="#ffffff" stroke-width="3"/>
  <!-- Top Section (GT) -->
  <text x="60" y="50" font-family="'Outfit', 'Inter', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">GT</text>
  <!-- Divider -->
  <line x1="15" y1="62" x2="105" y2="62" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Bottom Section Box (R) -->
  <rect x="15" y="68" width="90" height="38" fill="#b80f18" rx="4"/>
  <text x="60" y="96" font-family="'Outfit', 'Inter', sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">R</text>
</svg>
